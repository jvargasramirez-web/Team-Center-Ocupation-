<head>

<title>Team Centers — BG Ramirez K-8</title>
<style>
  :root {
    --tcb-build: "TCB-BRD-20261029-312edc12";
    --maroon: #5c0e21;
    --maroon-dark: #3e0916;
    --gold: #c8a24a;
    --gold-light: #e8d8ab;
    --cream: #fff8ec;
    --paper: #f4ede0;
    --green: #2f7a4f;
    --amber: #e8b230;
    --amber-ink: #3b2a00;
    --red: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: #2a1a1e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    background: var(--maroon);
    display: flex;
    align-items: center;
    gap: 2vw;
    padding: 1.2vh 2vw;
    border-bottom: 4px solid var(--gold);
  }
  .logo {
    width: clamp(48px, 8vh, 84px);
    height: clamp(48px, 8vh, 84px);
    border-radius: 50%;
    background: var(--cream);
    border: 2px solid var(--gold);
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.8vh; }
  .brandrow { display: flex; align-items: center; gap: 2vw; }
  .school { flex: 1; min-width: 0; }
  .closeb {
    align-self: flex-start;
    background: var(--amber); color: var(--amber-ink);
    border: 2px solid transparent; border-radius: 999px;
    padding: 0.4vh 1.2vw;
    font-size: clamp(0.8rem, 1.7vw, 1.5rem); font-weight: 700;
  }
  .closeb[hidden] { display: none; }
  .closeb.red { background: var(--red); color: #fff; border-color: var(--cream); }
  .date-line { color: var(--gold-light); font-size: clamp(0.8rem, 1.7vw, 1.4rem); margin-bottom: 0.3vh; }
  .lesson {
    background: var(--gold-light); border-bottom: 3px solid var(--gold);
    padding: 0.8vh 2vw; display: flex; align-items: center; gap: 1.4vw; flex-wrap: wrap;
  }
  .lesson[hidden] { display: none; }
  .ls-big { color: var(--maroon-dark); font-size: clamp(1.1rem, 2.6vw, 2.2rem); font-weight: 800; line-height: 1.1; }
  .ls-date { background: var(--maroon); color: var(--cream); border-radius: 999px; padding: 0.3vh 1.1vw; font-size: clamp(0.8rem, 1.5vw, 1.3rem); font-weight: 700; }
  .ls-note { background: var(--gold); color: var(--maroon-dark); border: 2px solid var(--maroon); border-radius: 999px; padding: 0.3vh 1.1vw; font-size: clamp(0.8rem, 1.5vw, 1.3rem); font-weight: 700; }
  .school-name { color: var(--cream); font-size: clamp(1rem, 2.6vw, 2.2rem); font-weight: 600; line-height: 1.1; }
  .school-sub { color: var(--gold-light); font-size: clamp(0.7rem, 1.4vw, 1.1rem); margin-top: 0.4vh; }
  .clock-box { text-align: right; }
  .clock { color: var(--cream); font-size: clamp(1.5rem, 4.4vw, 3.8rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .period-line { color: var(--gold-light); font-size: clamp(0.8rem, 1.7vw, 1.4rem); margin-top: 0.6vh; }
  .week-box {
    background: var(--gold);
    color: var(--maroon-dark);
    border-radius: 14px;
    text-align: center;
    padding: 0.8vh 1.6vw;
    min-width: clamp(60px, 8vw, 120px);
  }
  .week-label { font-size: clamp(0.65rem, 1.2vw, 1rem); font-weight: 600; letter-spacing: 0.04em; }
  .week-letter { font-size: clamp(1.8rem, 5vw, 4rem); font-weight: 700; line-height: 1; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 1.5vh 2vw 0.5vh;
    gap: 1.2vh;
    min-height: 0;
  }
  .announce {
    margin: 1vh 2vw 0;
    background: var(--gold); color: var(--maroon-dark);
    border: 4px solid var(--maroon); border-radius: 14px;
    padding: 0.9vh 1.4vw;
    display: flex; gap: 1.2vw; align-items: center;
  }
  .announce[hidden] { display: none; }
  .announce .tag {
    background: var(--maroon); color: var(--gold-light);
    border-radius: 8px; padding: 0.5vh 0.9vw;
    font-weight: 800; letter-spacing: 0.06em;
    font-size: clamp(0.75rem, 1.3vw, 1.1rem); white-space: nowrap;
  }
  .announce .msg { font-size: clamp(1rem, 2.3vw, 2.1rem); font-weight: 800; line-height: 1.1; }
  .stage { flex: 1; display: flex; min-height: 0; }
  .stage main { flex: 1; min-width: 0; }
  .notes {
    width: clamp(230px, 25vw, 460px);
    margin: 1.5vh 2vw 0.5vh 0;
    display: flex;
    flex-direction: column;
    gap: 1vh;
    min-height: 0;
    overflow: hidden;
  }
  .notes[hidden] { display: none; }
  /* cards are narrower while the notes panel is open, so the text is a little smaller */
  .stage.has-notes main:not(.closed-mode) .room { font-size: clamp(1rem, 1.9vw, 1.9rem); }
  .stage.has-notes main:not(.closed-mode) .teacher { font-size: clamp(0.7rem, 1.05vw, 1rem); }
  .stage.has-notes main:not(.closed-mode) .num { font-size: clamp(2.2rem, min(8vh, 5.2vw), 5.5rem); }
  .stage.has-notes main:not(.closed-mode) .lbl { font-size: clamp(0.65rem, 1vw, 0.95rem); }
  .stage.has-notes main:not(.closed-mode) .pill { font-size: clamp(0.7rem, 1.2vw, 1.05rem); }
  .notes-title {
    background: var(--maroon); color: var(--gold-light);
    border-radius: 12px; padding: 0.9vh 1vw;
    font-size: clamp(0.8rem, 1.4vw, 1.2rem); font-weight: 700; letter-spacing: 0.06em;
    border-bottom: 4px solid var(--gold);
  }
  .note {
    background: #fffdf8; border: 3px solid var(--gold); border-radius: 14px;
    padding: 1.1vh 1vw; color: #2a1a1e;
  }
  .note .nt { font-size: clamp(0.85rem, 1.4vw, 1.2rem); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
  .note .nm { font-size: clamp(0.7rem, 1vw, 0.9rem); color: #7a6a55; margin-top: 0.4vh; }
  .note.latest { background: var(--maroon); color: var(--cream); border-color: var(--gold); }
  .note.latest .nt { font-size: clamp(1.1rem, 2.3vw, 2.1rem); font-weight: 800; }
  .note.latest .nm { color: var(--gold-light); font-size: clamp(0.75rem, 1.2vw, 1rem); }
  .note.fresh { animation: notepulse 1.2s ease-in-out 4; }
  @keyframes notepulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,162,74,0.9); }
    50% { box-shadow: 0 0 0 16px rgba(200,162,74,0); }
  }
  .section { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 1.2vw;
    color: var(--maroon);
    font-size: clamp(1.2rem, 3vw, 2.6rem);
    font-weight: 700;
    margin-bottom: 0.8vh;
  }
  .section-title .line { flex: 1; height: 4px; background: var(--gold); border-radius: 2px; }
  .section-title .count { font-size: clamp(0.9rem, 1.8vw, 1.5rem); font-weight: 600; color: #7a6a55; white-space: nowrap; }
  .closed-strip {
    background: var(--maroon);
    border: 4px solid var(--gold);
    border-radius: 16px;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2vw;
    flex-wrap: wrap;
    padding: 1.2vh 2vw;
  }
  .closed-strip .cs-title { font-size: clamp(1.4rem, 4.2vw, 3.6rem); font-weight: 800; line-height: 1.05; letter-spacing: 0.02em; }
  .closed-strip .cs-title .x { color: var(--gold); margin-right: 0.4em; }
  .closed-strip .cs-sub { font-size: clamp(0.8rem, 1.5vw, 1.25rem); color: var(--gold-light); margin-top: 0.4vh; }
  .closed-strip .cs-stats { text-align: right; }
  .closed-strip .cs-big { font-size: clamp(1.2rem, 3vw, 2.6rem); font-weight: 700; line-height: 1.1; }
  .closed-strip .cs-small { font-size: clamp(0.8rem, 1.5vw, 1.25rem); color: var(--gold-light); }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 1.2vw;
    min-height: 0;
  }
  .card {
    border-radius: 16px;
    padding: 1.2vh 1.2vw 1.4vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    transition: background 0.4s ease;
  }
  .card.g { background: var(--green); color: #fff; }
  .card.a { background: var(--amber); color: var(--amber-ink); }
  .card.r { background: var(--red); color: #fff; }
  .card.w { background: #52667a; color: #fff; }
  .card.w .wx { font-size: clamp(2rem, min(7vh, 5.5vw), 5rem); font-weight: 800; line-height: 1; margin-top: auto; letter-spacing: 0.02em; }
  .card.w .pill { background: rgba(255,255,255,0.25); }
  .stage.has-notes main:not(.closed-mode) .wx { font-size: clamp(1.6rem, min(6vh, 4vw), 4rem); }
  main.closed-mode .wx { font-size: clamp(1.4rem, min(5vh, 3.6vw), 3rem); }
  .card.n { background: #fffdf8; color: #2a1a1e; border: 3px dashed #bba978; }
  .card.alert { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.7); }
    50% { box-shadow: 0 0 0 14px rgba(192,57,43,0); }
  }
  .room { font-size: clamp(1.1rem, 2.6vw, 2.3rem); font-weight: 700; line-height: 1.05; }
  .teacher { font-size: clamp(0.75rem, 1.4vw, 1.2rem); opacity: 0.9; margin-top: 0.3vh; min-height: 1.2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { font-size: clamp(2.6rem, min(9vh, 7vw), 7rem); font-weight: 700; line-height: 1; margin-top: auto; font-variant-numeric: tabular-nums; }
  .lbl { font-size: clamp(0.7rem, 1.3vw, 1.1rem); opacity: 0.92; margin-top: 0.3vh; }
  .pill {
    align-self: flex-start;
    margin-top: 0.8vh;
    padding: 0.4vh 1vw;
    border-radius: 999px;
    font-size: clamp(0.75rem, 1.5vw, 1.25rem);
    font-weight: 700;
    background: rgba(255,255,255,0.25);
  }
  .card.a .pill { background: rgba(59,42,0,0.15); }
  .card.n .pill { background: #efe6cf; }
  .send-here { font-size: clamp(0.7rem, 1.3vw, 1.1rem); font-weight: 700; margin-bottom: 0.4vh; letter-spacing: 0.03em; }

  .footer {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 0.8vh 2vw 1vh;
    font-size: clamp(0.7rem, 1.1vw, 0.95rem);
    color: #7a6a55;
  }
  .footer .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .footer .spacer { flex: 1; }
  .footer .credit { flex-basis: 100%; text-align: center; font-size: clamp(0.65rem, 0.95vw, 0.85rem); color: #9a8a76; letter-spacing: 0.02em; }
  .footer .credit:empty { display: none; }
  .footer select {
    font: inherit; padding: 3px 6px; border: 1px solid var(--maroon); border-radius: 6px;
    background: #fff; color: var(--maroon);
  }
  #copyNotice { position: sticky; top: 0; z-index: 99; background: #c0392b; color: #fff; text-align: center; font-weight: 700; padding: 0.8vh 2vw; font-size: clamp(0.8rem, 1.4vw, 1.2rem); border-bottom: 3px solid #fff8ec; }
  #copyNotice[hidden] { display: none; }
  .banner {
    margin: 1vh 2vw 0;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.95rem;
    background: #f8e2df;
    color: #7a1f16;
    display: none;
  }
  .closed {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--maroon);
    border: 6px solid var(--gold);
    border-radius: 24px;
    color: var(--cream);
    padding: 4vh 4vw;
    margin-bottom: 1vh;
  }
  .closed-x { font-size: clamp(3rem, 12vh, 9rem); line-height: 1; color: var(--gold); font-weight: 700; }
  .closed-title { font-size: clamp(2.2rem, 8vw, 7.5rem); font-weight: 800; line-height: 1.05; margin-top: 1.5vh; letter-spacing: 0.02em; }
  .closed-sub { font-size: clamp(1rem, 2.6vw, 2.2rem); color: var(--gold-light); margin-top: 2.5vh; }
  .empty { text-align: center; padding: 6vh 0; color: #7a6a55; font-size: 1.2rem; }

  /* Compact layout while the CLOSED strip is showing, so everything still fits */
  main.closed-mode { gap: 0.8vh; }
  main.closed-mode .closed-strip { padding: 0.8vh 1.6vw; border-width: 3px; border-radius: 12px; }
  main.closed-mode .cs-title { font-size: clamp(1.8rem, 5vw, 4.6rem); }
  main.closed-mode .cs-sub { font-size: clamp(0.85rem, 1.6vw, 1.4rem); margin-top: 0.3vh; }
  main.closed-mode .cs-big { font-size: clamp(1.1rem, 2.4vw, 2.2rem); }
  main.closed-mode .cs-small { font-size: clamp(0.8rem, 1.4vw, 1.2rem); }
  main.closed-mode .section-title { font-size: clamp(1rem, 2.2vw, 1.8rem); margin-bottom: 0.4vh; }
  main.closed-mode .section-title .count { font-size: clamp(0.8rem, 1.4vw, 1.2rem); }
  main.closed-mode .card { padding: 0.8vh 1vw; border-radius: 12px; }
  main.closed-mode .teacher { font-size: clamp(0.7rem, 1.2vw, 1rem); margin-top: 0; min-height: 0; }
  main.closed-mode .room { font-size: clamp(0.95rem, 1.8vw, 1.6rem); }
  main.closed-mode .num { font-size: clamp(1.8rem, min(7vh, 5vw), 4.2rem); }
  main.closed-mode .lbl { font-size: clamp(0.6rem, 1vw, 0.9rem); }
  main.closed-mode .pill { font-size: clamp(0.65rem, 1.1vw, 1rem); margin-top: 0.4vh; padding: 0.2vh 0.8vw; }

  /* Phones, zoomed browsers and very short screens: normal scrolling page, nothing can overlap */
  @media (max-width: 760px), (max-height: 560px) {
    html, body { height: auto; }
    body { display: block; min-height: 0; }
    main { display: block; }
    .stage { display: block; }
    .notes { width: auto; margin: 0 2vw 14px; }
    .section { display: block; margin-bottom: 14px; }
    .grid { display: grid; grid-auto-rows: auto; }
    .card { min-height: 130px; overflow: visible; }
    .closed-strip { margin-bottom: 12px; }
  }

  @media (max-width: 760px) {
    body { min-height: 100vh; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .topbar { flex-wrap: wrap; }
    .num { font-size: 3rem; }
  }
</style>
</head>

function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function pretty(t) { const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0'); }

function autoPeriod() {
  const now = nowDate();
  const n = now.getHours() * 60 + now.getMinutes();
  let next = null;
  for (const name of periodNames) {
    const [s, e] = PERIOD_TIMES[name];
    if (n >= toMin(s) && n <= toMin(e)) return { name, live: true };
    if (n < toMin(s) && !next) next = name;
  }
  if (next) return { name: next, live: false };
  return { name: periodNames[periodNames.length - 1], live: false };
}

function currentPeriod() {
  if (select.value === 'auto') return autoPeriod();
  return { name: select.value, live: true };

/* ---------- HISD lesson of the day (Lessons tab) ---------- */
const MONTH_KEYS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const WEEKDAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const DATE_TYPOS = { sept: 'sep', marth: 'march', februray: 'february', decemeber: 'december', wesnday: 'wednesday' };

function validDate(y, m, d) {
  const dt = new Date(y, m - 1, d);
  return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? dt : null;
}

// Reads "Wednesday Oct 28, 2026", "Thursday, November 12, 2026", "2026-10-28", "10/28/2026"...
// The weekday must match the date, so typos and last year's copies are skipped instead of guessed.
function parseLooseDate(raw) {
  let s = String(raw === null || raw === undefined ? '' : raw).toLowerCase().trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return validDate(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return validDate(+m[3], +m[1], +m[2]);
  Object.keys(DATE_TYPOS).forEach(k => { s = s.replace(new RegExp('\\b' + k + '\\b', 'g'), DATE_TYPOS[k]); });
  const mons = s.match(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/g);
  if (!mons || mons.length !== 1) return null;                        // none, or two dates in one cell
  const mi = MONTH_KEYS.indexOf(mons[0].slice(0, 3));
  const dm = s.match(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(\d{1,2})(?:st|nd|rd|th)?\b/);
  if (!dm) return null;
  const day = +dm[1];
  const wd = WEEKDAY_NAMES.findIndex(w => s.indexOf(w) >= 0);
  const ym = s.match(/\b(20\d\d)\b/);
  if (!ym && wd < 0) return null;
  const years = ym ? [+ym[1]] : [2025, 2026, 2027];
  const ok = years.map(y => validDate(y, mi + 1, day)).filter(d => d && (wd < 0 || d.getDay() === wd));
  return ok.length === 1 ? ok[0] : null;
}

function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Finds the columns by their titles (HISD / ILTexas / Notes), so the order does not matter
function parseLessons(rows) {
  let hi = -1, cH = -1, cI = -1, cN = -1;
  for (let r = 0; r < rows.length && hi < 0; r++) {
    const low = rows[r].map(x => String(x === null || x === undefined ? '' : x).trim().toLowerCase());
    let h = low.indexOf('hisd'); if (h < 0) h = low.findIndex(x => x.indexOf('hisd') === 0);
    let i = low.indexOf('iltexas'); if (i < 0) i = low.findIndex(x => x.indexOf('iltexas') === 0);
    if (h >= 0 && i >= 0 && h !== i) { hi = r; cH = h; cI = i; cN = low.findIndex(x => x.indexOf('note') === 0); }
  }
  const table = {};
  if (hi < 0) return table;
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    const d = parseLooseDate(row[cI]);
    if (!d) continue;
    const hisdRaw = String(row[cH] === undefined || row[cH] === null ? '' : row[cH]).trim();
    const note = cN >= 0 ? String(row[cN] === undefined || row[cN] === null ? '' : row[cN]).trim() : '';
    const key = isoOf(d);
    if (!table[key] || (!table[key].hisdRaw && hisdRaw)) table[key] = { hisd: parseLooseDate(hisdRaw), hisdRaw: hisdRaw, note: note };
  }
  return table;
}

let lessonTable = {};

function drawLesson() {
  const box = document.getElementById('lesson');
  const e = lessonTable[isoOf(nowDate())];
  if (!e || (!e.hisdRaw && !e.note)) { box.hidden = true; box.innerHTML = ''; return; }
  const note = e.note.slice(0, 120);
  let html;
  if (e.hisdRaw) {
    const bubble = e.hisd ? e.hisd.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : e.hisdRaw.slice(0, 40);
    html = '<span class="ls-big">HISD lesson</span><span class="ls-date">' + esc(bubble) + '</span>' +
      (note ? '<span class="ls-note">' + esc(note) + '</span>' : '');
  } else {
    html = '<span class="ls-big">' + esc(note) + '</span>';        // no lesson that day (holiday): just the note
  }
  box.hidden = false;
  box.innerHTML = html;
}

async function loadLessons() {
  if (!LESSONS_GID) return;
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${LESSONS_GID}&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    lessonTable = parseLessons(Papa.parse(await res.text(), { skipEmptyLines: false }).data);
  } catch (e) { /* keep the last table */ }
  drawLesson();
}

/* ---------- close-time bubble (under the logo) ---------- */
function updateCloseBubble(now) {
  const el = document.getElementById('closeBubble');
  let state = null;
  if (select.value === 'auto') {
    const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    for (const name of periodNames) {
      if (NO_TEAM_CENTER.indexOf(name) !== -1) continue;
      const startSec = toMin(PERIOD_TIMES[name][0]) * 60;
      const closeSec = startSec + CLOSE_AFTER_MINUTES * 60;
      if (nowSec >= startSec && nowSec < closeSec) { state = { left: closeSec - nowSec, closeMin: closeSec / 60 }; break; }
    }
  }
  if (!state) { el.hidden = true; return; }
  const hh = Math.floor(state.closeMin / 60), mm = state.closeMin % 60;
  const label = (hh % 12 || 12) + ':' + String(mm).padStart(2, '0') + (hh >= 12 ? ' PM' : ' AM');
  el.textContent = 'Team Centers close at ' + label + ' · ' + (state.left < 60 ? 'less than 1 min left' : Math.ceil(state.left / 60) + ' min left');
  el.className = 'closeb' + (state.left <= RED_AT_MINUTES * 60 ? ' red' : '');
  el.hidden = false;
}

function tickClock() {
  const now = nowDate();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  document.getElementById('dateLine').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  updateCloseBubble(now);
  const p = currentPeriod();
  const [s, e] = PERIOD_TIMES[p.name];
  document.getElementById('periodLine').textContent =
    (p.live ? '' : 'Next: ') + p.name + ' · ' + pretty(s) + '–' + pretty(e);
  const isClosed = !!closedInfo();
  if (isClosed !== wasClosed) { wasClosed = isClosed; load(); }
}

function prettyAP(t) { const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'); }

function reopenText(fromIndex) {
  for (let j = fromIndex + 1; j < periodNames.length; j++) {
    const nm = periodNames[j];
    if (!NO_TEAM_CENTER.includes(nm)) {
      return 'Team Centers reopen at ' + prettyAP(PERIOD_TIMES[nm][0]) + ' · ' + nm;
    }
  }
  return 'See you next school day';
}

function closedInfo() {
  if (select.value !== 'auto') {
    // Period 1 has no tab in the Sheet, so picking it by hand also shows the closed sign
    if (NO_TEAM_CENTER.indexOf(select.value) !== -1) {
      return { reopen: reopenText(periodNames.indexOf(select.value)), noTC: true };
    }
    return null;
  }
  const ap = autoPeriod();
  const apIndex = periodNames.indexOf(ap.name);
  if (NO_TEAM_CENTER.includes(ap.name)) {
    return { reopen: reopenText(apIndex), noTC: true };
  }
  const now = nowDate();
  const n = now.getHours() * 60 + now.getMinutes();
  for (let i = 0; i < periodNames.length; i++) {
    const name = periodNames[i];
    const [s, e] = PERIOD_TIMES[name];
    if (n >= toMin(s) + CLOSE_AFTER_MINUTES && n <= toMin(e)) {
      return { reopen: reopenText(i) };
    }
  }
  return null;
}

let wasClosed = false;

function statusOf(occ, cap) {
  if (!cap || cap <= 0) return 'g';
  if (occ >= cap) return 'r';
  if (occ / cap >= 0.8) return 'a';
  return 'g';
}
function labelOf(cls, occ, cap) {
  if (cls === 'r') return occ > cap ? 'Over capacity' : 'Full';
  if (cls === 'a') return 'Almost full';
  return 'Open';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Column G of a room row: a number above 0 = closed due to weather; a date (yyyy-mm-dd) = closed that day only
function todayIso() {
  const d = nowDate();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function weatherClosed(v) {
  const s = (v === undefined || v === null) ? '' : String(v).trim();
  if (!s) return false;
  if (/^\d+$/.test(s)) return Number(s) > 0;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s === todayIso();
  return false;
}

function parseSheet(rows) {
  const out = { week: '', MS: [], ES: [] };
  let current = null;
  rows.forEach(row => {
    const a = (row[0] || '').toString().trim();
    const up = a.toUpperCase();
    if (up === 'WEEK:') { out.week = (row[1] || '').toString().trim().toUpperCase(); return; }
    if (up === 'MIDDLE SCHOOL') { current = 'MS'; return; }
    if (up === 'ELEMENTARY') { current = 'ES'; return; }
    if (!current || !a) return;
    if (up.startsWith('SECTION TOTAL')) return;
    const cap = parseFloat(row[2]);
    const occ = parseFloat(row[3]);
    if (isNaN(cap) || isNaN(occ)) return;
    out[current].push({
      name: a.split('\n')[0].trim(),
      teacher: (row[1] || '').toString().trim(),
      cap, occ,
      closed: weatherClosed(row[6])
    });
  });
  return out;
}

function fixedCard(r) {
  if (r.closed) {
    return `<div class="card w">
    <div class="room">${esc(r.name)}</div>
    <div class="teacher">${esc(r.teacher)}</div>
    <div class="wx">CLOSED</div>
    <div class="lbl">closed due to weather</div>
    <div class="pill">Weather</div>
  </div>`;
  }
  const cls = statusOf(r.occ, r.cap);
  return `<div class="card ${cls}">
    <div class="room">${esc(r.name)}</div>
    <div class="teacher">${esc(r.teacher)}</div>
    <div class="num">${Math.max(r.cap - r.occ, 0)}</div>
    <div class="lbl">seats open of ${r.cap}</div>
    <div class="pill">${labelOf(cls, r.occ, r.cap)}</div>
  </div>`;
}

function overflowCard(r, fixedAllFull) {
  const rest = r.name.replace(/^\s*overflow\b[\s:\-–—]*/i, '').trim();
  const notSet = !rest || rest.charAt(0) === '(';
  const title = notSet ? 'Overflow room' : rest.charAt(0).toUpperCase() + rest.slice(1);
  const sub = notSet ? 'Room not set yet' : 'Overflow room';
  const used = r.occ > 0;
  let cls = used ? statusOf(r.occ, r.cap) : 'n';
  let alertCls = '';
  let banner = '';
  if (fixedAllFull && r.occ < r.cap && !window.__closed) {
    cls = 'r'; alertCls = ' alert';
    banner = '<div class="send-here">SEND STUDENTS HERE</div>';
  }
  const pill = (cls === 'n') ? 'Standby' : (alertCls ? 'Open overflow' : labelOf(cls, r.occ, r.cap));
  return `<div class="card ${cls}${alertCls}">
    ${banner}
    <div class="room">${esc(title)}</div>
    <div class="teacher">${esc(sub)}${r.teacher ? ' · ' + esc(r.teacher) : ''}</div>
    <div class="num">${Math.max(r.cap - r.occ, 0)}</div>
    <div class="lbl">seats open of ${r.cap}</div>
    <div class="pill">${pill}</div>
  </div>`;
}

function splitRooms(rooms) {
  const isOver = (r, i) => /overflow/i.test(r.name) || i >= 3;
  return {
    fixed: rooms.filter((r, i) => !isOver(r, i)),
    overs: rooms.filter((r, i) => isOver(r, i))
  };
}

function sumOcc(list) { return list.reduce((s, r) => s + r.occ, 0); }

function section(title, rooms) {
  if (!rooms.length) return '';
  const { fixed, overs } = splitRooms(rooms);
  const openFixed = fixed.filter(r => !r.closed);
  const allFull = fixed.length > 0 && openFixed.every(r => r.occ >= r.cap);
  // The overflow room is shared by both levels, so each level's count is its own rooms only
  const students = sumOcc(openFixed);
  const cols = Math.min(Math.max(fixed.length + overs.length, 1), 4);
  let html = `<div class="section"><div class="section-title"><span>${title}</span><span class="line"></span><span class="count">${students} student${students === 1 ? '' : 's'}</span></div><div class="grid" style="--cols:${cols}">`;
  fixed.forEach(r => { html += fixedCard(r); });
  overs.forEach(r => { html += overflowCard(r, allFull); });
  html += '</div></div>';
  return html;
}

let lastWeek = '';

let lastAnn = [];
let lastWeekAt = 0;

// Announcement rows (Period 2 tab, columns L:M): "Friday", "Mon, Wed", "2026-10-30" or "daily"
function dayMatches(cell) {
  const s = (cell || '').toString().trim().toLowerCase();
  if (!s) return false;
  const dow = previewDay() || ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][nowDate().getDay()];
  const iso = todayIso();
  if (/^(daily|every ?day|all|always)$/.test(s)) return true;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s === iso;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return (m[3] + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0')) === iso;
  return s.split(/[\s,;&\/]+/).some(tok => tok.length >= 3 && tok.slice(0, 3) === dow);
}

function drawAnnounce() {
  const box = document.getElementById('announce');
  const act = lastAnn.filter(a => dayMatches(a.day)).slice(0, 3);
  if (!act.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '<span class="tag">TODAY</span><div class="msgs">' +
    act.map(a => '<div class="msg">' + esc(a.msg) + '</div>').join('') + '</div>';
}

let lastNotes = [];
let topNoteSeen = 0;
const NOTE_SHOW_MINUTES = 60;   // a note stays on the board this long

function drawNotes() {
  const box = document.getElementById('notes');
  const now = Date.now();
  const live = lastNotes
    .filter(n => now - n.t <= NOTE_SHOW_MINUTES * 60000 && n.t - now < 5 * 60000)
    .sort((a, b) => b.t - a.t)
    .slice(0, 4);
  const stage = document.querySelector('.stage');
  if (!live.length) { box.hidden = true; box.innerHTML = ''; stage.classList.remove('has-notes'); return; }
  const fresh = topNoteSeen !== 0 && live[0].t > topNoteSeen;
  topNoteSeen = Math.max(topNoteSeen, live[0].t);
  box.hidden = false;
  stage.classList.add('has-notes');
  box.innerHTML = '<div class="notes-title">TEAM CENTER NOTES</div>' + live.map((n, i) => {
    const when = new Date(n.t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return '<div class="note' + (i === 0 ? ' latest' : '') + (i === 0 && fresh ? ' fresh' : '') + '">' +
      '<div class="nt">' + esc(n.text) + '</div>' +
      '<div class="nm">' + when + (n.from ? ' · ' + esc(n.from) : '') + '</div></div>';
  }).join('');
}

async function loadWeek() {
  try {
    const gid = PERIOD_GIDS[WEEK_SOURCE_PERIOD];
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = Papa.parse(await res.text(), { skipEmptyLines: false }).data;
    const notes = [];
    const ann = [];
    rows.forEach((row, i) => {
      if ((row[0] || '').toString().trim().toUpperCase() === 'WEEK:') {
        lastWeek = (row[1] || '').toString().trim().toUpperCase();
      }
      // notes are kept in columns H:J of this tab (time, note, from); row 1 is the header
      if (i > 0) {
        const t = Date.parse((row[7] || '').toString().trim());
        const text = (row[8] || '').toString().trim();
        if (!isNaN(t) && text) notes.push({ t, text, from: (row[9] || '').toString().trim() });
        const aDay = (row[11] || '').toString().trim();
        const aMsg = (row[12] || '').toString().trim();
        if (aDay && aMsg) ann.push({ day: aDay, msg: aMsg });
      }
    });
    lastNotes = notes;
    lastAnn = ann;
  } catch (e) { /* keep the last known week, notes and announcements */ }
  document.getElementById('weekLetter').textContent = lastWeek || '–';
  drawNotes();
  drawAnnounce();
}

let lastGood = null;

let loading = false, again = false, failCount = 0, lastDrawKey = '';

async function load() {
  if (loading) { again = true; return; }      // never two downloads at the same time
  loading = true;
  try { await loadInner(); }
  finally { loading = false; if (again) { again = false; load(); } }
}

async function loadInner() {
  tickClock();
  if (Date.now() - lastWeekAt >= WEEK_EVERY_MS) { lastWeekAt = Date.now(); loadWeek(); }
  const closed = closedInfo();
  if (closed && closed.noTC) {
    wasClosed = true;
    document.getElementById('content').classList.remove('closed-mode');
    document.getElementById('banner').style.display = 'none';
    document.getElementById('content').innerHTML =
      '<div class="closed"><div class="closed-x">✕</div><div class="closed-title">TEAM CENTERS CLOSED</div><div class="closed-sub">' +
      esc(closed.reopen) + '</div></div>';
    return;
  }
  wasClosed = !!closed;
  const p = currentPeriod();
  const gid = PERIOD_GIDS[p.name];
  const banner = document.getElementById('banner');
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&_=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const key = text + '|' + p.name + '|' + (closed ? 1 : 0) + '|' + todayIso();
    if (key !== lastDrawKey) {                 // only redraw when something actually changed
      const parsed = parseSheet(Papa.parse(text, { skipEmptyLines: false }).data);
      if (!parsed.MS.length && !parsed.ES.length) throw new Error('No room data found on this tab');
      lastGood = parsed;
      draw(parsed);
      lastDrawKey = key;
    }
    failCount = 0;
    banner.style.display = 'none';
    document.getElementById('updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US') +
      ' · sheet ' + SHEET_ID.slice(0, 6) + '…' + SHEET_ID.slice(-6) + ' · ' + p.name + (TV_MODE ? ' · fast' : '');
  } catch (err) {
    failCount++;                                // wait longer before trying again
    lastDrawKey = '';
    if (lastGood) {
      banner.style.display = 'block';
      banner.textContent = 'Connection problem. Showing the last update. (' + err.message + ')';
      draw(lastGood);
    } else {
      document.getElementById('content').innerHTML =
        '<div class="empty">Could not load the seats. Make sure the Google Sheet is shared as "Anyone with the link". (' + esc(err.message) + ')</div>';
    }
  }
}

function draw(data) {
  const closed = closedInfo();
  window.__closed = !!closed;
  let banner = '';
  if (closed) {
    const ms = splitRooms(data.MS), es = splitRooms(data.ES);
    const fixedAll = ms.fixed.concat(es.fixed).filter(r => !r.closed);
    const wxClosed = ms.fixed.concat(es.fixed).filter(r => r.closed).length;
    // One shared overflow room: count it once (the larger of the two entries)
    const ovStudents = Math.max(sumOcc(ms.overs), sumOcc(es.overs));
    const ovRooms = Math.max(ms.overs.length, es.overs.length);
    const students = sumOcc(fixedAll) + ovStudents;
    const totalRooms = fixedAll.length + ovRooms;
    const inUse = fixedAll.filter(r => r.occ > 0).length + (ovRooms > 0 && ovStudents > 0 ? 1 : 0);
    banner = `<div class="closed-strip">
      <div><div class="cs-title"><span class="x">✕</span>TEAM CENTERS CLOSED</div>
      <div class="cs-sub">${esc(closed.reopen)}</div></div>
      <div class="cs-stats"><div class="cs-big">${students} student${students === 1 ? '' : 's'} in Team Centers</div>
      <div class="cs-small">${inUse} of ${totalRooms} rooms in use${ovStudents > 0 ? ' · ' + ovStudents + ' in overflow' : ''}${wxClosed > 0 ? ' · ' + wxClosed + ' closed due to weather' : ''}</div></div>
    </div>`;
  }
  const box = document.getElementById('content');
  box.classList.toggle('closed-mode', !!closed);
  box.innerHTML =
    banner + section('Middle School', data.MS) + section('Elementary', data.ES);
}

select.addEventListener('change', () => load());
document.getElementById('credit').textContent = [CREDIT_TEXT, CREDIT_CONTACT].filter(Boolean).join('  ·  ');
setInterval(tickClock, 1000);
setInterval(drawNotes, 20000);
setInterval(drawAnnounce, 60000);
loadLessons();
setInterval(loadLessons, 30 * 60 * 1000);
setInterval(drawLesson, 60 * 1000);

// Next check: normal pace, or slower (up to 2 minutes) after errors, with a little randomness
function nextDelay() {
  return Math.min(REFRESH_SECONDS * 1000 * Math.pow(2, failCount), 120000) + Math.random() * 800;
}
async function loop() {
  if (TV_MODE || !document.hidden) await load();
  setTimeout(loop, nextDelay());
}
loop();
</script>
